name: Check translations

on:
  push:
    paths:
      - 'src/translations/**'
  pull_request:
    paths:
      - 'src/translations/**'
  workflow_dispatch: {}

jobs:
  check-translations:
    name: Validate translation keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund

      - name: Run TypeScript translation validator
        run: |
          npm run check:translations:ts
